name: GeoRisk Sentinel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 src/ --max-line-length=120 --exclude=src/web/georisk_web/__pycache__

  test-django:
    name: Django checks
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: georisk
          POSTGRES_USER: georisk_user
          POSTGRES_PASSWORD: georisk2019
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: georisk
      POSTGRES_USER: georisk_user
      POSTGRES_PASSWORD: georisk2019

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r src/web/requirements_web.txt

      - name: Django system check
        run: |
          cd src/web
          python manage.py check --deploy 2>&1 || true
          python manage.py check
